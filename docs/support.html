<body>
  <h1>跑城支持</h1>
  <p>如果你在使用跑城时遇到问题，或希望反馈路线、地图、Apple 健康同步等相关问题，请通过 GitHub Issues 联系我们。</p>

  <h2>联系方式</h2>
  <p>支持入口：<a href="https://github.com/pandy/run-city/issues">https://github.com/pandy/run-city/issues</a></p>

  <h2>反馈时建议提供</h2>
  <ul>
    <li>你的设备型号和 iOS 版本。</li>
    <li>跑城 App 版本。</li>
    <li>遇到问题的城市、路线名称或操作步骤。</li>
    <li>如方便，可附上截图或错误提示。</li>
  </ul>

  <h2>常见问题</h2>
  <p>如果路线或地图显示异常，请先确认 App 已更新到最新版本，并尝试重新打开 App。若问题仍存在，请通过支持入口反馈。</p>

  <p><a href="index.html">返回首页</a></p>
